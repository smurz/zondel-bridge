name: Build VST3

on:
  push:
    branches: [main]
    paths:
      - 'src/core/**'
      - 'src/shared-cpp/**'
      - 'src/vst3/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-vst3.yaml'
      - 'installer/installer-vst3.iss'
  pull_request:
    branches: [main]
    paths:
      - 'src/core/**'
      - 'src/shared-cpp/**'
      - 'src/vst3/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-vst3.yaml'
      - 'installer/installer-vst3.iss'
  workflow_dispatch:

jobs:
  windows-vst3:
    name: VST3 Windows x64
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read plug-in version
        id: meta
        run: |
          $bs = Get-Content -Path buildspec.json -Raw | ConvertFrom-Json
          "version=$($bs.version)" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: |
          cmake -S . -B build_vst3 `
            -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_OBS=OFF `
            -DBUILD_VST3=ON `
            -DBUILD_PLUGIN_TESTS=ON

      - name: Build Zondel.vst3 + validator + tests
        run: |
          cmake --build build_vst3 --config Release --target Zondel `
            --parallel -- /noLogo
          cmake --build build_vst3 --config Release --target validator `
            --parallel -- /noLogo
          cmake --build build_vst3 --config Release --target test-zondel-engine test-realtime-budget fake-pipe-server `
            --parallel -- /noLogo

      - name: Run Steinberg validator
        run: |
          $bundle = "build_vst3\VST3\Release\Zondel.vst3"
          $validator = "build_vst3\bin\Release\validator.exe"
          if (-not (Test-Path $bundle)) { throw "Bundle not produced: $bundle" }
          if (-not (Test-Path $validator)) { throw "Validator not produced: $validator" }
          $out = & $validator $bundle 2>&1
          $out
          $summary = $out | Select-String -Pattern "tests passed, \d+ tests failed"
          if (-not $summary) { throw "Validator did not produce a summary line" }
          $failed = [int]([regex]::Match($summary.Line, '(\d+) tests failed').Groups[1].Value)
          if ($failed -gt 0) { throw "Validator failed: $failed test(s)" }
          Write-Host "Validator: clean — $($summary.Line)"

      - name: Run engine + realtime-budget tests
        run: |
          Push-Location build_vst3\Release
          .\test-zondel-engine.exe
          if ($LASTEXITCODE -ne 0) { throw "test-zondel-engine failed" }
          .\test-realtime-budget.exe
          if ($LASTEXITCODE -ne 0) { throw "test-realtime-budget failed" }
          Pop-Location

      - name: Package VST3 bundle
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $stage = "release"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Recurse -Path "build_vst3\VST3\Release\Zondel.vst3" -Destination $stage
          $zipName = "Zondel-vst3-v$ver-windows-x64.zip"
          Compress-Archive -Path "$stage\Zondel.vst3" -DestinationPath "$stage\$zipName" -Force
          Get-FileHash -Path "$stage\$zipName" -Algorithm SHA256 | `
            ForEach-Object { "$($_.Hash.ToLower())  $zipName" } | `
            Set-Content -Path "$stage\$zipName.sha256"
          "zipName=$zipName" >> $env:GITHUB_OUTPUT
        id: pkg

      - name: Build Inno Setup installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Warning "Inno Setup not found on runner; skipping installer build."
            "skipInstaller=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $ver = "${{ steps.meta.outputs.version }}"
          & $iscc /DAppVersion="$ver" installer\installer-vst3.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit $LASTEXITCODE" }
          $exe = Get-ChildItem -Path "installer\Output\Zondel-vst3-v$ver-setup.exe"
          Copy-Item $exe.FullName -Destination release\
          "exeName=$($exe.Name)" >> $env:GITHUB_OUTPUT
        id: installer
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zondel-vst3-${{ steps.meta.outputs.version }}-windows-x64
          path: |
            release/Zondel-vst3-*-windows-x64.zip
            release/Zondel-vst3-*-windows-x64.zip.sha256
            release/Zondel-vst3-*-setup.exe
          if-no-files-found: warn
